<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>صانع بوتات سترفيون</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      padding: 18px;
      background: #171020;
      color: white;
    }

    .container {
      max-width: 520px;
      margin: auto;
    }

    .logo {
      text-align: center;
      font-size: 50px;
      margin-top: 10px;
    }

    h1 {
      text-align: center;
      font-size: 25px;
      margin: 8px 0;
    }

    .welcome {
      text-align: center;
      color: #cfc5d9;
      margin-bottom: 18px;
    }

    .count {
      background: #24172f;
      border: 1px solid #3b2848;
      border-radius: 16px;
      padding: 15px;
      text-align: center;
      margin-bottom: 18px;
      font-size: 18px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .bot-button {
      border: 1px solid #3b2848;
      background: #24172f;
      color: white;
      border-radius: 14px;
      padding: 14px 8px;
      min-height: 58px;
      font-size: 14px;
    }

    .bot-button:active {
      transform: scale(0.97);
      background: #352342;
    }

    .number {
      color: #a98bff;
      font-size: 12px;
      display: block;
      margin-bottom: 4px;
    }
  </style>
</head>

<body>

<div class="container">

  <div class="logo">🤖</div>

  <h1>صانع بوتات سترفيون</h1>

  <div class="welcome">
    👋 اختر نوع البوت الذي تريد صنعه
  </div>

  <div class="count">
    📊 عدد البوتات: <strong>33 بوتًا</strong>
  </div>

  <div class="grid" id="botList"></div>

</div>

<script>

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const makerBot =
"https://t.me/STRVEONBOT?start=from_x2irxxpcczw5k8";

const bots = [
  "بوت الأزرار",
  "طلبات الانضمام",
  "صارحني",
  "القرآن الكريم - كامل",
  "ضغط الفيديو",
  "الترجمة",
  "اشتراكات VIP",
  "تعليم الإنجليزية",
  "إنشاء منشور",
  "الزخرفة",
  "لعبة XO",
  "شطرنج مباشر",
  "محول صيغ الملفات",
  "تلخيص ذكي",
  "تحميل الفيديوهات",
  "محرر الوسائط",
  "الصوت = النص",
  "اختصار الروابط",
  "صانع ملصقات",
  "بوت التواصل",
  "مراقب المحافظ",
  "متجر مصغر",
  "حجز مواعيد",
  "دعم فني وتذاكر",
  "نماذج واستبيانات",
  "إدارة قناة",
  "منيو QR",
  "OCR صورة إلى نص",
  "مساعد ذكي مبسط",
  "أدوات PDF",
  "همسة",
  "لعبة روليت",
  "بريد مؤقت"
];

const list = document.getElementById("botList");

bots.forEach((bot, index) => {

  const button = document.createElement("button");

  button.className = "bot-button";

  button.innerHTML = `
    <span class="number">#${index + 1}</span>
    ${bot}
  `;

  button.onclick = () => {

    const encodedBot = encodeURIComponent(bot);

    const url =
      makerBot + "&type=" + encodedBot;

    if (tg.openTelegramLink) {
      tg.openTelegramLink(url);
    } else {
      window.location.href = url;
    }

  };

  list.appendChild(button);

});

</script>

</body>
</html>
